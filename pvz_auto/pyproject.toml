[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvz-auto"
version = "0.1.0"
description = "Local capture and input calibration for Plants vs. Zombies Hybrid Edition"
requires-python = ">=3.11"
dependencies = ["mss>=9.0", "opencv-python>=4.9"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
pvz-window-probe = "pvz_auto.capture.window_capture:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
